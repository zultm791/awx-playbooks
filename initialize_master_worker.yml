---
# Node prep for Kubernetes (Ubuntu/Debian). Uses only ansible.builtin modules — no modprobe collection.
#
# Kernel prep is best-effort only (never fails the play). LXC often cannot modprobe; bridge sysctl may no-op.
# AWX: remove any extra var kubernetes_allow_restricted_node — it is no longer used. Sync this file from SCM.

- name: Initialize master and worker nodes
  hosts: all
  become: true
  vars:
    kubernetes_version_short: "1.30"
    kubernetes_apt_signed_by: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
    ansible_python_interpreter: /usr/bin/python3.12
  tasks:
    - name: Check if kernel modules are visible in sysfs
      ansible.builtin.stat:
        path: "/sys/module/{{ item }}"
      loop:
        - overlay
        - br_netfilter
      register: k8s_module_before

    - name: Try modprobe when module not visible (ignore all errors)
      ansible.builtin.command: modprobe {{ item.item }}
      loop: "{{ k8s_module_before.results }}"
      when: not item.stat.exists
      failed_when: false
      changed_when: false

    - name: Persist kernel modules on reboot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Sysctl bridge settings for Kubernetes (ignored if br_netfilter unavailable)
      ansible.builtin.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
      ignore_errors: true

    - name: Sysctl IP forward
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Disable SWAP immediately
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Disable SWAP in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*?\\sswap\\s+.*)$"
        replace: "# \\1"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker-archive-keyring.asc
        mode: "0644"

    - name: Dearmor Docker apt key
      ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker-archive-keyring.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present

    - name: Ensure containerd config directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Use systemd cgroup driver in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"
      notify: Restart containerd

    - name: Download Kubernetes apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Dearmor Kubernetes apt key
      ansible.builtin.command: gpg --dearmor -o {{ kubernetes_apt_signed_by }} /tmp/kubernetes-release.key
      args:
        creates: "{{ kubernetes_apt_signed_by }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by={{ kubernetes_apt_signed_by }}] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/ /
        mode: "0644"

    - name: Install Kubernetes binaries
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
