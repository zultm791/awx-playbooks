---
# Node prep for Kubernetes (Ubuntu/Debian). Uses only ansible.builtin modules — no modprobe collection.
#
# modprobe may return "Operation not permitted" in LXC/unprivileged containers; many kernels already expose
# overlay/br_netfilter (built-in). We try modprobe, then require /sys/module/<name> to exist.
# AWX: sync this repo to the project; set Job Template path so ansible.cfg is used (silences Python discovery).
# Python warning: project ansible.cfg uses interpreter_python=auto_silent, or set ansible_python_interpreter on hosts.

- name: Initialize master and worker nodes
  hosts: all
  become: true
  vars:
    kubernetes_version_short: "1.30"
    kubernetes_apt_signed_by: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
    ansible_python_interpreter: /usr/bin/python3.12
  tasks:
    - name: Check if kernel modules are visible in sysfs
      ansible.builtin.stat:
        path: "/sys/module/{{ item }}"
      loop:
        - overlay
        - br_netfilter
      register: k8s_module_before

    - name: Try modprobe when module not yet visible (ignore EPERM)
      ansible.builtin.command: modprobe {{ item.item }}
      loop: "{{ k8s_module_before.results }}"
      when: not item.stat.exists
      become: true
      failed_when: false
      changed_when: false
      register: k8s_modprobe_attempt

    - name: Verify kernel modules are available (built-in or loaded)
      ansible.builtin.stat:
        path: "/sys/module/{{ item }}"
      loop:
        - overlay
        - br_netfilter
      register: k8s_module_verify

    - name: Fail if Kubernetes kernel modules are missing
      ansible.builtin.fail:
        msg: >-
          Module {{ item.item }} is not present under /sys/module/.
          modprobe often returns Operation not permitted inside unprivileged LXC/Docker.
          Use KVM/VM or bare-metal nodes, a privileged container profile, or load these modules on the hypervisor.
      loop: "{{ k8s_module_verify.results }}"
      when: not item.stat.exists

    - name: Persist kernel modules on reboot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Configure sysctl for Kubernetes networking
      ansible.builtin.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Disable SWAP immediately
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Disable SWAP in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*?\\sswap\\s+.*)$"
        replace: "# \\1"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: true

    - name: Create keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker apt signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker-archive-keyring.asc
        mode: "0644"

    - name: Dearmor Docker apt key
      ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker-archive-keyring.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        state: present

    - name: Ensure containerd config directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Use systemd cgroup driver in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"
      notify: Restart containerd

    - name: Download Kubernetes apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Dearmor Kubernetes apt key
      ansible.builtin.command: gpg --dearmor -o {{ kubernetes_apt_signed_by }} /tmp/kubernetes-release.key
      args:
        creates: "{{ kubernetes_apt_signed_by }}"

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by={{ kubernetes_apt_signed_by }}] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version_short }}/deb/ /
        mode: "0644"

    - name: Install Kubernetes binaries
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
