---
- name: Configuration of master node
  hosts: master_setup_host
  become: true
  tasks:
    - name: Nuclear Reset (Clean everything)
      ansible.builtin.shell: |
        kubeadm reset -f
        systemctl stop kubelet
        systemctl stop containerd
        # DELETE THE FAILED DATABASE DIRECTORY
        rm -rf /var/lib/etcd
        rm -rf /etc/kubernetes/manifests
        rm -rf /etc/cni/net.d
        # Reset networking
        ip link delete cni0 || true
      failed_when: false

    - name: Ensure kernel modules for K8s are loaded
      ansible.builtin.shell: |
        modprobe overlay
        modprobe br_netfilter
        echo -e "overlay\nbr_netfilter" > /etc/modules-load.d/k8s.conf

    - name: Configure Containerd with SystemdCgroup
      ansible.builtin.shell: |
        rm -f /etc/containerd/config.toml
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      notify: Restart containerd

    - name: Restart and Wait for Containerd
      ansible.builtin.meta: flush_handlers

    - name: Initialize K8S cluster
      ansible.builtin.command: >
        kubeadm init 
        --pod-network-cidr=172.16.0.0/16 
        --apiserver-advertise-address=192.168.100.5 
        --ignore-preflight-errors=Mem
      register: kubeadm_init

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
