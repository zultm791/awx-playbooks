---
- name: Configuration of master node
  hosts: master_setup_host
  become: true
  tasks:
    - name: Reset Kubernetes (Crucial to clear old failed 645MB attempts)
      ansible.builtin.command: kubeadm reset -f
      failed_when: false

    - name: Ensure Containerd config exists and is fresh
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
      # We do this to ensure no old, broken configs are lingering

    - name: Set SystemdCgroup to true in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Flush handlers to restart containerd now
      ansible.builtin.meta: flush_handlers

    - name: Initialize K8S cluster (The 8GB Power Move)
      ansible.builtin.command: >
        kubeadm init 
        --pod-network-cidr=172.16.0.0/16 
        --apiserver-advertise-address=192.168.100.5
      register: kubeadm_init

    - name: Create .kube directory for zultahir
      ansible.builtin.file:
        path: "/home/zultahir/.kube"
        state: directory
        owner: zultahir
        group: zultahir
        mode: '0755'

    - name: Copy admin.conf to zultahir's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/zultahir/.kube/config"
        remote_src: yes
        owner: zultahir
        group: zultahir
        mode: '0600'

    - name: Install Pod network (Calico)
      become: false
      ansible.builtin.command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.25.0/manifests/calico.yaml
      args:
        creates: "/home/zultahir/.kube/config"

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
