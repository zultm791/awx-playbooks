---
- name: Update Windows Servers
  hosts: Group_Windows_2016
  vars:
    # Increase these to handle slow Windows 2016 response times
    ansible_winrm_operation_timeout_sec: 600
    ansible_winrm_read_timeout_sec: 650
    ansible_winrm_connection_timeout: 600
  tasks:
    - name: Install updates with async to prevent timeout
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        state: installed
        reboot: yes
        reboot_timeout: 3600
      # Use async to let the task run independently of the connection
      async: 7200 
      poll: 30
